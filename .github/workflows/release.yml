name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Verify signing secrets are present
        # Fail immediately with a readable message rather than shipping an unsigned APK,
        # which is what app/build.gradle.kts falls back to when the secrets are missing.
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE_B64:-}" ]      || missing+=(SIGNING_KEYSTORE_B64)
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing+=(SIGNING_KEYSTORE_PASSWORD)
          [ -n "${KEY_ALIAS:-}" ]         || missing+=(SIGNING_KEY_ALIAS)
          [ -n "${KEY_PASSWORD:-}" ]      || missing+=(SIGNING_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} — see 'Release signing' in the README."
            exit 1
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Read pinned SDK versions from the version catalog
        id: sdk
        run: |
          set -euo pipefail
          catalog=gradle/libs.versions.toml
          read_key() {
            grep -E "^$1[[:space:]]*=" "$catalog" | head -1 | sed -E 's/.*"([^"]+)".*/\1/'
          }
          {
            echo "compile_sdk=$(read_key compileSdk)"
            echo "build_tools=$(read_key buildTools)"
            echo "ndk=$(read_key ndk)"
            echo "cmake=$(read_key cmake)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Install SDK components
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # `yes` is killed by SIGPIPE as soon as sdkmanager stops reading, which pipefail
          # would report as a failed pipeline. Drop pipefail for this one call so a genuine
          # sdkmanager failure still trips `set -e` on its own exit status.
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          major='${{ steps.sdk.outputs.compile_sdk }}'
          # Drop preview lines FIRST: grep -o would truncate "android-37.2-beta3" down to
          # "android-37.2" and let a preview masquerade as the stable minor.
          platform=$("$sdkmanager" --list 2>/dev/null | tr -d '\r' \
            | grep -E "platforms[;/]android-${major}" \
            | grep -viE 'beta|preview|canary|[[:space:]]rc[0-9]' \
            | grep -oE "platforms[;/]android-${major}(\.[0-9]+)?" \
            | tr '/' ';' \
            | sort -uV | tail -1)
          if [ -z "$platform" ]; then
            echo "::error::No stable platforms;android-${major}.x package is available."
            exit 1
          fi
          "$sdkmanager" \
            "platform-tools" \
            "$platform" \
            "build-tools;${{ steps.sdk.outputs.build_tools }}" \
            "cmake;${{ steps.sdk.outputs.cmake }}" \
            "ndk;${{ steps.sdk.outputs.ndk }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          # Outside the workspace so it can never be picked up by a build input or artifact.
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the APK is actually signed
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::No release APK produced."; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools/${{ steps.sdk.outputs.build_tools }}" -name apksigner | head -1)
          "$apksigner" verify --verbose --print-certs "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Rename and checksum
        run: |
          set -euo pipefail
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          out="the-machine-${tag}.apk"
          cp "$APK_PATH" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "--- $out ---"
          cat "$out.sha256"
          echo "RELEASE_APK=$out" >> "$GITHUB_ENV"

      - name: Shred the keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/signing/release.jks" 2>/dev/null || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.RELEASE_APK }}
            ${{ env.RELEASE_APK }}.sha256
          body: |
            The Machine — offline voice assistant for Android.

            **Install:** download the APK below and sideload it. There is no Play Store build.
            Verify the download against the `.sha256` file before installing.

            Models are **not** bundled. On first launch the app downloads the speech, language
            and voice models it needs (about 1 GB for the defaults) and verifies each by SHA-256.
            After that it never touches the network again.
